<div class="container mt-3">
  <h1>Travlr Getaways Admin!</h1>

  <button class="btn btn-info mb-3" routerLink="/add">
    Add Trip
  </button>

  <div class="row">
    <div class="col-md-4 mb-3" *ngFor="let trip of trips">
      <app-trip-card [trip]="trip"></app-trip-card>
    </div>
  </div>
</div>
