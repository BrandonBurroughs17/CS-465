<div class="container mt-3">
  <h2>Add Trip</h2>

  <form [formGroup]="addForm" (ngSubmit)="onSubmit()">

    <div class="form-group mb-2">
      <label>Code</label>
      <input class="form-control" formControlName="code">
    </div>

    <div class="form-group mb-2">
      <label>Name</label>
      <input class="form-control" formControlName="name">
    </div>

    <div class="form-group mb-2">
      <label>Length</label>
      <input class="form-control" formControlName="length">
    </div>

    <div class="form-group mb-2">
      <label>Start</label>
      <input class="form-control" formControlName="start">
    </div>

    <div class="form-group mb-2">
      <label>Resort</label>
      <input class="form-control" formControlName="resort">
    </div>

    <div class="form-group mb-2">
      <label>Price Per Person</label>
      <input class="form-control" formControlName="perPerson">
    </div>

    <div class="form-group mb-2">
      <label>Image</label>
      <input class="form-control" formControlName="image">
    </div>

    <div class="form-group mb-2">
      <label>Description</label>
      <textarea class="form-control" formControlName="description"></textarea>
    </div>

    <button type="submit" class="btn btn-info mt-2">
      Add Trip
    </button>

    <button type="button" class="btn btn-secondary mt-2 ms-2" routerLink="/">
      Cancel
    </button>

  </form>
</div>
